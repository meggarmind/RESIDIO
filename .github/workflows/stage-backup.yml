name: Stage backup

# `stage` is the last master that passed checks — the rollback point.
#
# It advances ONLY from master, ONLY when the gate below is green, and ONLY here.
# Nothing pushes to `stage` by hand. If `stage` lags `master`, the commits between
# them have not passed. See docs/agents/branching.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-backup
  cancel-in-progress: false

jobs:
  gate-and-advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      # Prerendering builds a Supabase client, so the build needs these set.
      # src/lib/supabase/config.ts reads SUFFIXED names chosen by
      # NEXT_PUBLIC_ENV_MODE — the unsuffixed NEXT_PUBLIC_SUPABASE_URL /
      # NEXT_PUBLIC_SUPABASE_ANON_KEY are never read, so setting those alone
      # left the client undefined and failed the prerender of
      # /settings/audit-logs. Pin the mode so which pair is read is explicit.
      # Placeholders are sufficient: nothing here contacts Supabase, and no
      # real credential belongs in this workflow.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENV_MODE: cloud
          NEXT_PUBLIC_SUPABASE_URL_CLOUD: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY_CLOUD: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY_CLOUD: placeholder-service-role-key

      # Only reached when every step above succeeded.
      - name: Advance stage to this commit
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/stage"
          echo "stage -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report when the gate fails
        if: failure()
        run: |
          echo "Gate failed — \`stage\` was NOT advanced and still points at the last green master." >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back from \`origin/stage\` via a PR; see docs/agents/branching.md." >> "$GITHUB_STEP_SUMMARY"
