# Backup Cron - Invoice Generation
# This workflow acts as a safety net in case the production scheduler (Coolify
# scheduled tasks on the KVM) fails.
# It runs daily and checks if invoice generation is needed for the current month.
# If the scheduled run failed to generate invoices, this will trigger generation.
#
# STATUS: HELD until the hosting setup (#262) is complete and the stage and
# production GitHub Environments each hold APP_URL and CRON_SECRET. The workflow
# is also disabled in Actions (`gh workflow disable`), which is Actions state and
# can be reversed by anyone; src/__tests__/integration/backup-cron-workflow.test.ts
# is the repo-side guard. It fails if this marker says HELD while an uncommented
# `schedule:` exists, so while HELD the schedule is commented out. To release:
# create the per-environment secrets, uncomment `schedule:`, change the marker line
# above to `# STATUS: ACTIVE`, then enable the workflow in Actions.
# The marker only keeps the file self-consistent; GitHub cannot refuse an enable.
# If parameters are missing at run time the preflight skips that environment (a
# green skip) and emails the sys_admin instead of failing the run.
#
# Parameters (GitHub Environments `stage` and `production`, environment secrets):
#   APP_URL      the public https origin of that deployment, no path
#   CRON_SECRET  the CRON_SECRET configured on that deployment
# Alerting (repository secrets, used only when parameters are missing):
#   ALERT_RESEND_API_KEY, ALERT_EMAIL_FROM, ALERT_EMAIL_TO
#
# TODO: if the app hosts sit behind Cloudflare Access, the curl calls below need
# the CF_ACCESS_* headers. Unverified; confirm when the hosting setup is done.
#
# SECURITY NOTE: This workflow only uses environment and repository secrets and
# does not process any untrusted user input. Secrets reach scripts through `env:`
# and are never interpolated into `run:` text.

name: Backup Cron - Invoice Generation

on:
  # HELD: schedule stays commented out until STATUS above is ACTIVE; restore it then.
  # schedule:
  #   # Run at 7 AM UTC daily (1 hour after the scheduled run at 6 AM)
  #   - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

permissions:
  contents: read

jobs:
  check-and-generate:
    name: check-and-generate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [stage, production]
    environment: ${{ matrix.environment }}
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Skips the rest of the job (green) when parameters are missing, and emails
      # the sys_admin. Fails only if that alert itself cannot be sent.
      - name: Preflight parameters
        id: preflight
        env:
          ALERT_RESEND_API_KEY: ${{ secrets.ALERT_RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: node scripts/backup-cron-preflight.mjs "$TARGET_ENVIRONMENT"

      - name: Check cron health status
        id: health-check
        if: steps.preflight.outputs.ok == 'true'
        run: |
          echo "Checking cron health at ${APP_URL}/api/health/cron-status"

          # Authenticated with the same CRON_SECRET bearer this workflow already
          # sends to /api/cron/generate-invoices below. This endpoint was
          # unauthenticated until #174 closed it; without the header the check
          # would get 403, fall into the "unknown" branch and exit 0, leaving
          # this safety net silently inert.

          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/health/cron-status" || echo "error")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Health check failed with HTTP $HTTP_CODE"
            echo "needs_generation=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse invoice generation status using jq
          INVOICE_STATUS=$(echo "$BODY" | jq -r '.jobs[] | select(.name == "invoice-generation") | .status' 2>/dev/null || echo "unknown")

          echo "Invoice generation status: $INVOICE_STATUS"
          echo "invoice_status=$INVOICE_STATUS" >> "$GITHUB_OUTPUT"

          # Check if generation is needed
          if [ "$INVOICE_STATUS" = "critical" ]; then
            echo "::warning::Invoice generation is OVERDUE - will trigger backup generation"
            echo "needs_generation=true" >> "$GITHUB_OUTPUT"
          else
            echo "Invoice generation status is healthy or waiting"
            echo "needs_generation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger backup invoice generation
        if: steps.preflight.outputs.ok == 'true' && steps.health-check.outputs.needs_generation == 'true'
        run: |
          echo "Triggering backup invoice generation..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/generate-invoices" || echo "error")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Backup invoice generation completed successfully"

            # Extract stats if available
            GENERATED=$(echo "$BODY" | jq -r '.generated // "unknown"' 2>/dev/null)
            SKIPPED=$(echo "$BODY" | jq -r '.skipped // "unknown"' 2>/dev/null)
            ERRORS=$(echo "$BODY" | jq -r '.errors // "unknown"' 2>/dev/null)

            echo "Generated: $GENERATED, Skipped: $SKIPPED, Errors: $ERRORS"
          else
            echo "::error::Backup invoice generation failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Log status
        if: always() && steps.preflight.outputs.ok == 'true'
        env:
          INVOICE_STATUS: ${{ steps.health-check.outputs.invoice_status }}
          NEEDS_GENERATION: ${{ steps.health-check.outputs.needs_generation }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          echo "=== Backup Cron Summary ($TARGET_ENVIRONMENT) ==="
          echo "Date: $(date -u)"
          echo "Invoice Status: $INVOICE_STATUS"
          echo "Generation Needed: $NEEDS_GENERATION"
          echo "=========================="
