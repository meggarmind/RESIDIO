name: Release

# Tag-only release automation (#397 Part 2).
#
# When a PR merges into `master` (a release PR from `stage`, or a hotfix), its release label
# decides the version, computed by scripts/release-version.mjs from the LAST `vX.Y.Z` tag:
#
#   release:major | release:minor | release:patch  ->  push tag vX.Y.Z on the merge commit
#   release:none, no release label, unknown label  ->  do nothing (the run still passes)
#
# Nothing is ever committed to `master`: branch protection requires a PR and the `PR gate`
# check, and a bot commit would need an exemption. The tag IS the version; anything that
# shows a version (#421) reads the tag.
#
# Stage is not touched here: it deploys from stage-image.yml on every push to `stage` (#1114).
#
# A fast-forward release (release-fast-forward.yml, #1137) tags in its own workflow and does not
# come through here.
#
# Merges into `stage` never run this: a release:* label on a feature PR has no effect.
#
# The first time, run this workflow by hand (Actions > Release > Run workflow) to create the
# four labels.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      # Full history so every existing tag is visible to the version calculation.
      - name: Check out the merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Work out the version
        id: version
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/release-version.mjs

      - name: Push the tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REASON: ${{ steps.version.outputs.reason }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Not moving it; tags are immutable."
            exit 1
          fi
          # Guard (#1116, #1137): a release is a merge commit with two parents (CORE.md section 7),
          # or a commit that is on stage. A squash on master is neither, so it is refused.
          parents=$(git rev-list --parents -n 1 "${MERGE_SHA}" | wc -w)
          if [ "${parents}" -lt 3 ] && ! git merge-base --is-ancestor "${MERGE_SHA}" origin/stage; then
            echo "::error::${MERGE_SHA} has fewer than two parents and is not on stage, so it is neither a merge-commit release nor a stage commit. Release PRs must be merged with a merge commit, never a squash. Not tagging."
            exit 1
          fi
          existing=$(git tag --list 'v*' --points-at "${MERGE_SHA}")
          if [ -n "${existing}" ]; then
            echo "::error::${MERGE_SHA} already carries release tag(s): ${existing}. Not adding ${TAG} to the same commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" "${MERGE_SHA}" --message "Release ${TAG} (#${PR_NUMBER}, ${REASON})"
          git push origin "refs/tags/${TAG}"
          echo "Tagged \`${TAG}\` on \`${MERGE_SHA}\` (${REASON})." >> "$GITHUB_STEP_SUMMARY"

      - name: Report no release
        if: steps.version.outputs.tag == ''
        env:
          REASON: ${{ steps.version.outputs.reason }}
        run: |
          echo "No tag pushed: ${REASON}." >> "$GITHUB_STEP_SUMMARY"

  # Writes the new tag into residio-prod's build variables (#421). It never deploys Prod.
  # A job here rather than `on: push: tags` in coolify-version.yml, because the tag above is
  # pushed with GITHUB_TOKEN and so starts no other workflow; see that file's header.
  coolify-version:
    name: Set the Prod build version in Coolify
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/coolify-version.yml
    with:
      environment: production
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    # Only what the Prod path needs; never `secrets: inherit`.
    secrets:
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      COOLIFY_APP_UUID_PROD: ${{ secrets.COOLIFY_APP_UUID_PROD }}

  # Drafts the release notes page for the new tag (#1236, docs/agents/release-notes.md).
  release-notes:
    name: Draft the release notes page
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # One-off setup, safe to re-run: creates or updates the four release labels.
  # GitHub rejects a label description over 100 characters (HTTP 422);
  # src/__tests__/release-version.test.ts checks each one.
  labels:
    name: Create release labels
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Create or update labels
        run: |
          gh label create "release:major" --repo "$REPO" --force --color B60205 \
            --description "Release PR: not drop-in (new required env var, breaking migration, access-control API change)"
          gh label create "release:minor" --repo "$REPO" --force --color FBCA04 \
            --description "Release PR: new capability, drop-in upgrade"
          gh label create "release:patch" --repo "$REPO" --force --color 0E8A16 \
            --description "Release PR: fixes only"
          gh label create "release:none" --repo "$REPO" --force --color C5DEF5 \
            --description "Merged into master without a release tag"
