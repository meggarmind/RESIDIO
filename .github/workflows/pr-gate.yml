name: PR Gate

# The required check for every pull request into `stage` or `master` (#397).
#
# Before this existed nothing ran the suite until AFTER a merge (stage-backup.yml, on push to
# master), so a red commit was only discovered once it was already on the branch. This runs
# lint, typecheck, unit tests and a production build on the PR itself.
#
# BLOCKING by design, same reasoning as migration-drift.yml. Do NOT add `continue-on-error`
# (the harness-label.yml idiom): a gate that cannot fail gates nothing.
#
# Branch protection should require the single `PR gate` check below, not the four individual
# jobs, so the job list can change without touching the protection settings.
#
# Speed (#497):
#   - A `changes` job classifies the PR. A docs-only PR (every path under docs/ or *.md/*.mdx)
#     skips lint, typecheck, test and build; the `PR gate` check still runs and passes.
#     Anything unclear (non-PR event, empty list, git error) runs everything.
#   - Lint (.eslintcache) and typecheck (tsbuildinfo) restore caches. Build does not (see there).
#   - The workflow also runs on pushes to `stage`: a PR run can only restore caches from its own
#     ref or its base branch, so runs on `stage` seed caches every PR can read.
#   - Trigger-level `paths:` filtering is FORBIDDEN here: a required check whose workflow never
#     runs stays pending forever and blocks the PR.
#
# Playwright is deliberately absent. e2e/fixtures.ts needs cloud Supabase with seeded users,
# which would make every PR depend on shared mutable state. e2e stays a manual pre-release
# step (#269).

on:
  pull_request:
    branches: [stage, master]
  # Seeds caches for PR runs (see header). Push runs are not a merge gate.
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fails safe: any doubt yields docs_only=false, which runs everything.
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          count=0
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if files=$(git diff --name-only "${BASE_SHA}"..."${HEAD_SHA}"); then
              if [ -n "${files}" ]; then
                count=$(printf '%s\n' "${files}" | wc -l)
                if ! printf '%s\n' "${files}" | grep -qvE '^(docs/.*|.*\.mdx?)$'; then
                  docs_only=true
                fi
              fi
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          {
            echo "### Detect changes"
            echo "- Changed files: ${count}"
            echo "- docs_only: ${docs_only}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-

      # Fails on errors only; the existing warning baseline does not block.
      # Content strategy because checkout resets mtimes, which defeats the default metadata one.
      - name: Lint
        run: npm run lint -- --cache --cache-strategy content --cache-location .eslintcache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # tsconfig.json already sets `incremental: true`, so tsc writes and reuses this file even
      # with --noEmit.
      - name: Cache tsbuildinfo
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Vitest
        run: npx vitest run

  # tsc and Vitest both accept things `next build` rejects (a synchronous export from a
  # 'use server' module broke master for a day in #356), so the build is part of the gate.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # No .next/cache step, deliberately (#497). Next 16 builds with Turbopack, which does not
      # persist its compile cache there without an experimental flag; measured, the cache held
      # 200 KB and changed nothing. Of the ~80 s build, ~34 s is compile and ~39 s is Next's own
      # TypeScript pass (which also checks the generated .next/types that the Typecheck job lacks).

      # Prerendering builds a Supabase client, so the build needs these set.
      # src/lib/supabase/config.ts reads SUFFIXED names chosen by NEXT_PUBLIC_ENV_MODE, so the
      # mode is pinned to make explicit which pair is read. Placeholders are sufficient: nothing
      # here contacts Supabase, and no real credential belongs in this workflow.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENV_MODE: cloud
          NEXT_PUBLIC_SUPABASE_URL_CLOUD: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY_CLOUD: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY_CLOUD: placeholder-service-role-key

  # The one check branch protection requires. `always()` makes it run (and fail) when a job
  # above failed or was cancelled; without it this job would be skipped, and GitHub treats a
  # skipped required check as passing. Heavy jobs may be `skipped` only for a docs-only PR.
  # Never replace this with trigger-level `paths:` filtering: a required check whose workflow
  # never runs stays pending forever.
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, build]
    if: always()
    steps:
      # jq is preinstalled on ubuntu-latest.
      - name: Require every gate job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          fail=0
          docs_only=$(echo "${NEEDS}" | jq -r '.changes.outputs.docs_only // "false"')
          changes=$(echo "${NEEDS}" | jq -r '.changes.result // "missing"')
          echo "| job | result |"
          echo "| --- | --- |"
          echo "| changes | ${changes} |"
          if [ "${changes}" != "success" ]; then
            echo "::error::Job 'changes' did not succeed (${changes}). This PR must not merge."
            fail=1
          fi
          for job in lint typecheck test build; do
            result=$(echo "${NEEDS}" | jq -r --arg j "${job}" '.[$j].result // "missing"')
            echo "| ${job} | ${result} |"
            if [ "${result}" = "success" ]; then
              continue
            fi
            if [ "${result}" = "skipped" ] && [ "${docs_only}" = "true" ]; then
              continue
            fi
            echo "::error::Job '${job}' did not succeed (${result}). This PR must not merge."
            fail=1
          done
          exit "${fail}"
