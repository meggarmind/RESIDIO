name: Coolify Version

# Writes the build version into each Coolify application's build variables (#421 slice B):
# NEXT_PUBLIC_APP_VERSION (the release the commit belongs to; the rule is resolveVersion in
# the script), NEXT_PUBLIC_GIT_SHA and NEXT_PUBLIC_APP_ENV. The logic, the Coolify endpoints
# and the doc pages they came from are in scripts/coolify-version.mjs.
#
#   staging     every push to `stage`: set the variables on residio-stage, then pin its
#               commit (git_commit_sha) to the same SHA. No deploy: the KVM cron deploys Stage
#               every 4 hours through the Coolify API, and that build uses the pinned commit,
#               so it always matches the variables. Stage's Coolify auto-deploy stays off.
#               Exception (#525): release.yml calls this with `deploy: true` for a
#               release:major merged from `stage`, and the script then also queues a Stage
#               deploy of that commit, unless `stage` has already moved past it.
#   production  every new release tag: set the variables on residio-prod ONLY. Prod is never
#               deployed from CI; the owner deploys it by hand after migrations (CORE.md §11,
#               docs/deployment/hosting-plan.md:226). The script fails a production run
#               asked to deploy. There is no deploy step in this file; the decision lives
#               in the script.
#
# Why the release tag arrives through workflow_call, not `on: push: tags`:
# release.yml pushes the vX.Y.Z tag with the default GITHUB_TOKEN, and events caused by
# GITHUB_TOKEN never start other workflows, so a tag trigger here would never fire.
# `workflow_run` on Release would fire, but its head_sha is the PR's head commit, not the
# merge commit the tag sits on, so this workflow would have to rediscover the tag. Instead
# release.yml calls this file as a reusable workflow, from a job that `needs` the tag job and
# runs only when a tag was pushed, passing the merge commit. Same run, no guessing.
#
# Unconfigured is not an error: until the six secrets exist, the script logs a ::notice::
# naming the missing ones and exits 0. Setup: docs/agents/branching.md.

on:
  push:
    branches: [stage]
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      ref:
        description: The commit to describe (the release merge commit)
        type: string
        required: true
      deploy:
        description: Also deploy Stage (staging only; the script refuses it for production)
        type: boolean
        required: false
        default: false
    # Declared, not `secrets: inherit`, so a caller passes only what its target needs.
    # All optional: a missing one makes the script skip with a notice, not fail.
    secrets:
      COOLIFY_BASE_URL:
        required: false
      COOLIFY_API_TOKEN:
        required: false
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
      COOLIFY_APP_UUID_STAGE:
        required: false
      COOLIFY_APP_UUID_PROD:
        required: false
  # Manual re-run, e.g. to set Prod's variables for a tag cut before the secrets existed.
  # Run it from `master` for production and from `stage` for staging (enforced below).
  workflow_dispatch:
    inputs:
      environment:
        description: Which Coolify application
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

jobs:
  set-version:
    name: Set the build version in Coolify
    runs-on: ubuntu-latest
    # A push to `stage` has no inputs, so it targets staging.
    env:
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
    # One run per environment at a time, so two Stage pushes cannot interleave their
    # set-then-deploy. Queued, not cancelled: a cancel between the two calls would leave the
    # variables set with no deploy. GitHub keeps only the newest pending run.
    concurrency:
      group: coolify-version-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      # Each application builds from one branch, so a manual run must describe that branch.
      - name: Refuse a manual run from the wrong branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          ((inputs.environment == 'production' && github.ref != 'refs/heads/master') ||
           (inputs.environment == 'staging' && github.ref != 'refs/heads/stage'))
        run: |
          echo "::error::Run production from master and staging from stage."
          exit 1

      # Full history and tags, so the version rule can see every vX.Y.Z tag and its parents.
      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Write the build variables
        env:
          GIT_SHA: ${{ inputs.ref || github.sha }}
          # Only a workflow_call can ask for it; a push or a manual run never deploys.
          DEPLOY: ${{ inputs.deploy && 'true' || 'false' }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COOLIFY_APP_UUID_STAGE: ${{ secrets.COOLIFY_APP_UUID_STAGE }}
          COOLIFY_APP_UUID_PROD: ${{ secrets.COOLIFY_APP_UUID_PROD }}
        run: node scripts/coolify-version.mjs
