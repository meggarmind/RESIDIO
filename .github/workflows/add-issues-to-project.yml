name: Auto Add Issues to Project

on:
  issues:
    types: [opened, edited]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue to Project
        uses: actions/add-to-project@v0.5.0  # or latest stable version
        with:
          project-url: https://github.com/orgs/Meggarminds/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
