name: PR Claim Check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: read

jobs:
  claim-check:
    name: Check whether another harness has worked the linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Advisory, not blocking — reversed from this workflow's original stance (#344).
      #
      # It used to gate on the linked issue's assignee, on the reasoning that a non-blocking
      # warning was the very thing that let claim discipline go unenforced (#297). That
      # reasoning held for a discipline; it does not hold here, and the assignee rule was
      # unworkable regardless: all three harnesses authenticate as the same GitHub login, so
      # the assignee cannot tell them apart, and with one human on the project the only
      # outcome it could ever produce was "unassigned". It failed 10 of its last 15 runs, none
      # of them on an issue anyone had contended for, which taught the repo to read a red X
      # here as the normal state.
      #
      # The harness record lives in `harness:*` labels instead (docs/agents/project-board.md),
      # so the script reads those and reports an overlap as a ::warning:: annotation. An
      # overlap is a fact about the issue's history, not a defect in the PR — often the other
      # harness's work is what you want to build on. There is no continue-on-error here: the
      # script exits 0 on every rule path by design, so a red job means the check could not
      # run (missing configuration, an API that would not answer) and should be seen.
      #
      # The default GITHUB_TOKEN is sufficient: this only reads pull request and issue data on
      # a public repo, and a pull_request run from a fork still receives a read-only token
      # with that access. The script fails loudly rather than passing silently if the token
      # cannot read what it needs.
      - name: Check PR claim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-claim-check.mjs --ci
